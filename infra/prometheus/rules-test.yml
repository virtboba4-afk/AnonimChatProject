rule_files:
  - alerts.yml

evaluation_interval: 5s

tests:
  - name: normal traffic does not fire
    interval: 5s
    input_series:
      - series: 'http_server_requests_seconds_count{job="chat-rest",method="GET",uri="/api/profiles/{id}/activity",status="200"}'
        values: '0+10x36'
    alert_rule_test:
      - eval_time: 150s
        alertname: ChatActivityHighErrorRatio
        exp_alerts: []

  - name: no traffic does not fire
    interval: 5s
    input_series:
      - series: 'http_server_requests_seconds_count{job="chat-rest",method="GET",uri="/api/profiles/{id}/activity",status="200"}'
        values: '0+0x36'
    alert_rule_test:
      - eval_time: 150s
        alertname: ChatActivityHighErrorRatio
        exp_alerts: []

  - name: low volume does not fire
    interval: 5s
    input_series:
      - series: 'http_server_requests_seconds_count{job="chat-rest",method="GET",uri="/api/profiles/{id}/activity",status="503"}'
        values: '0+0.25x36'
    alert_rule_test:
      - eval_time: 150s
        alertname: ChatActivityHighErrorRatio
        exp_alerts: []

  - name: failure goes pending firing resolved
    interval: 5s
    input_series:
      - series: 'http_server_requests_seconds_count{job="chat-rest",method="GET",uri="/api/profiles/{id}/activity",status="200"}'
        values: '0+10x12 120+0x24 120+10x40'
      - series: 'http_server_requests_seconds_count{job="chat-rest",method="GET",uri="/api/profiles/{id}/activity",status="503"}'
        values: '0+0x12 0+10x24 240+0x40'
    alert_rule_test:
      - eval_time: 60s
        alertname: ChatActivityHighErrorRatio
        exp_alerts: []
      - eval_time: 150s
        alertname: ChatActivityHighErrorRatio
        exp_alerts:
          - exp_labels:
              alertname: ChatActivityHighErrorRatio
              job: chat-rest
              severity: warning
              team: course
            exp_annotations:
              summary: "Доля 5xx активности профиля выше 20 процентов"
              description: "Окно 1 минута, не менее 10 запросов, выдержка 20 секунд."
              dashboard_url: "http://localhost:3000/d/chat-golden-signals"
              runbook_url: "http://localhost:3000/d/chat-golden-signals?viewPanel=9"
      - eval_time: 370s
        alertname: ChatActivityHighErrorRatio
        exp_alerts: []

  - name: good ratio counts slow success and failures as bad
    interval: 5s
    input_series:
      - series: 'http_server_requests_seconds_bucket{job="chat-rest",method="GET",uri="/api/profiles/{id}/activity",status="200",le="0.5"}'
        values: '0+5x60'
      - series: 'http_server_requests_seconds_count{job="chat-rest",method="GET",uri="/api/profiles/{id}/activity",status="200"}'
        values: '0+8x60'
      - series: 'http_server_requests_seconds_count{job="chat-rest",method="GET",uri="/api/profiles/{id}/activity",status="503"}'
        values: '0+2x60'
    promql_expr_test:
      - expr: chat:activity_good_ratio:rate5m
        eval_time: 300s
        exp_samples:
          - labels: 'chat:activity_good_ratio:rate5m'
            value: 0.5
