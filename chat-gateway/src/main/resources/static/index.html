<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AnonimChat BFF</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 760px; margin: 32px auto; padding: 0 16px; }
        button { margin: 4px 4px 4px 0; padding: 6px 12px; }
        pre { background: #f4f4f4; padding: 12px; overflow-x: auto; white-space: pre-wrap; }
    </style>
</head>
<body>
<h1>AnonimChat — Gateway / BFF</h1>
<p id="who">Проверяем сессию…</p>

<div id="anon" hidden>
    <a href="/oauth2/authorization/keycloak"><button>Войти через Keycloak</button></a>
</div>

<div id="authed" hidden>
    <button onclick="call('GET', '/api/profiles')">Профили</button>
    <button onclick="call('POST', '/api/profiles', {nickname: 'Anon', age: 20, preferredLanguage: 'en'})">Создать профиль</button>
    <button onclick="call('GET', '/api/reports')">Жалобы (admin)</button>
    <button onclick="call('GET', '/bff/me')">/bff/me</button>
    <form id="logout" method="post" action="/logout" style="display:inline">
        <input type="hidden" name="_csrf" id="logoutCsrf">
        <button type="submit">Выйти</button>
    </form>
</div>

<pre id="out"></pre>

<script>
    const out = document.getElementById('out');

    async function csrf() {
        return fetch('/bff/csrf', {credentials: 'same-origin'}).then(r => r.json());
    }

    async function call(method, url, body) {
        const headers = {};
        if (method !== 'GET') {
            const t = await csrf();
            headers[t.headerName] = t.token;
        }
        if (body) headers['Content-Type'] = 'application/json';
        const started = performance.now();
        const r = await fetch(url, {method, headers, credentials: 'same-origin', body: body && JSON.stringify(body)});
        const text = await r.text();
        out.textContent = `${method} ${url} -> ${r.status} (${Math.round(performance.now() - started)} ms)\n\n${text}`;
    }

    (async () => {
        const me = await fetch('/bff/me', {credentials: 'same-origin'}).then(r => r.json());
        if (me.authenticated) {
            document.getElementById('who').textContent = `Вы вошли как ${me.username}`;
            document.getElementById('authed').hidden = false;
            const t = await csrf();
            document.getElementById('logoutCsrf').name = t.parameterName;
            document.getElementById('logoutCsrf').value = t.token;
        } else {
            document.getElementById('who').textContent = 'Вы не авторизованы';
            document.getElementById('anon').hidden = false;
        }
    })();
</script>
</body>
</html>
