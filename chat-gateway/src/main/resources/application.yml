server:
  port: 8088
  reactive:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        # в production за HTTPS: SESSION_COOKIE_SECURE=true
        secure: ${SESSION_COOKIE_SECURE:false}

spring:
  application:
    name: chat-gateway

  reactor:
    context-propagation: auto

  data:
    redis:
      host: localhost
      port: 6379

  session:
    redis:
      namespace: course:gateway

  security:
    oauth2:
      client:
        provider:
          keycloak:
            issuer-uri: http://localhost:8085/realms/course
        registration:
          keycloak:
            provider: keycloak
            client-id: course-bff
            client-secret: course-bff-secret
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: openid,profile,email

  cloud:
    gateway:
      httpclient:
        connect-timeout: 500
        response-timeout: 3s
      routes:
        # Белый список: наружу публикуем только API профилей и жалоб из chat-rest
        - id: chat-rest
          uri: http://localhost:8089
          predicates:
            - Path=/api/profiles,/api/profiles/**,/api/reports,/api/reports/**
          filters:
            - TokenRelay=
            - RemoveRequestHeader=Cookie

management:
  server:
    port: ${MANAGEMENT_PORT:9088}
    address: ${MANAGEMENT_ADDRESS:127.0.0.1}
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
        add-additional-paths: true
      group:
        readiness:
          include: readinessState,redis
  observations:
    enable:
      spring.security: false
  tracing:
    propagation:
      type: w3c
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: http://localhost:4318/v1/traces
  opentelemetry:
    resource-attributes:
      deployment.environment.name: local
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 100ms,300ms,500ms,1s,2s
      minimum-expected-value:
        http.server.requests: 1ms
      maximum-expected-value:
        http.server.requests: 3s

logging:
  include-application-name: false
  pattern:
    correlation: "[${spring.application.name:},trace_id=%X{traceId:-},span_id=%X{spanId:-},request_id=%X{requestId:-}] "
