server.port=8089
# доверяем X-Forwarded-* от шлюза: ссылки HATEOAS строятся на адрес gateway
server.forward-headers-strategy=framework

spring.rabbitmq.host=127.0.0.1
spring.rabbitmq.username=course_user
spring.rabbitmq.password=course_password
springdoc.packages-to-scan=org.example.rest.controllers

rabbitmq.exchange.name=chat.events.exchange

spring.datasource.url=jdbc:postgresql://localhost:5432/chat_db
spring.datasource.username=chat_user
spring.datasource.password=qwerty

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.flyway.enabled=true


spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8085/realms/course
spring.security.oauth2.resourceserver.jwt.audiences=recommendation-service,chat-rest

spring.application.name=chat-rest

chat.audit.base-url=http://localhost:8081

spring.security.oauth2.client.registration.chat-audit.provider=keycloak
spring.security.oauth2.client.registration.chat-audit.client-id=course-service-client
spring.security.oauth2.client.registration.chat-audit.client-secret=course-service-secret
spring.security.oauth2.client.registration.chat-audit.authorization-grant-type=client_credentials
spring.security.oauth2.client.provider.keycloak.token-uri=http://localhost:8085/realms/course/protocol/openid-connect/token

management.server.port=${MANAGEMENT_9089:9089}
management.server.address=${MANAGEMENT_ADDRESS:127.0.0.1}
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.probes.add-additional-paths=true
management.endpoint.health.group.readiness.include=readinessState,db
management.observations.enable.spring.security=false
management.tracing.propagation.type=w3c
management.tracing.sampling.probability=1.0
management.otlp.tracing.endpoint=http://localhost:4318/v1/traces
management.opentelemetry.resource-attributes.deployment.environment.name=local
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.slo.http.server.requests=100ms,300ms,500ms,1s,2s
management.metrics.distribution.minimum-expected-value.http.server.requests=1ms
management.metrics.distribution.maximum-expected-value.http.server.requests=3s

logging.include-application-name=false
logging.pattern.correlation=[${spring.application.name:},trace_id=%X{traceId:-},span_id=%X{spanId:-},request_id=%X{requestId:-}]\u0020
